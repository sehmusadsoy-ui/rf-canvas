name: RF receive safety guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rf-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - name: Validate passive RF and allocation invariants
        run: python3 scripts/check_rf_security.py
