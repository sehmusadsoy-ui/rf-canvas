name: Historical secret signature guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-signature-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only checkout with refs and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan local Git blobs without printing secrets
        run: python3 scripts/git_history_secret_guard.py
